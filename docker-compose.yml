services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-appodo_deca}
      POSTGRES_USER: ${DB_USER:-appodo_deca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - deca_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appodo_deca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - deca_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Tareas programadas: aviso a los administradores de DeCA hechos sin
  # cobertura que siguen sin completar, y purga de IPs antiguas del
  # historial. Misma imagen que el backend, en bucle cada hora (los dos
  # comandos son idempotentes: avisan/purgan una sola vez cada cosa).
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    entrypoint: ["sh", "-c", "sleep 60; while true; do python manage.py avisar_deca_sin_completar; python manage.py purgar_ips_eventos_deca; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  deca_db_data:
  deca_media:
