# Si delante hay un proxy con HTTPS, este manda X-Forwarded-Proto: https y
# hay que pasárselo tal cual al backend (si no, Django cree que la petición
# era http y el QR del DeCA llevaría http://). Sin proxy delante, vale el
# esquema de esta conexión.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de móvil y PDF escaneados: el backend admite hasta 10 MB por
    # documento (core_utils/validacion_ficheros.py). El límite por defecto de
    # nginx (1 MB) cortaría la subida antes de llegar a Django con un 413.
    client_max_body_size 15m;

    # El service worker nunca se cachea: si no, un móvil podría quedarse con
    # una versión vieja de la lógica de sincronización de DeCA sin cobertura.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un fichero real cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API y media del backend Django, mismo origen para simplificar CORS/cookies
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    # Documentos y PDF: el backend solo los sirve con sesión iniciada
    # (core_utils/media_protegida.py), por eso pasan por Django.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
